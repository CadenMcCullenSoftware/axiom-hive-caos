[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caos"
version = "1.0"
description = "Counter-Adversary Operations System — human-in-the-loop framework for operations against adversarial AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
caos = "caos.cli:main"

[tool.setuptools]
packages = ["caos"]
